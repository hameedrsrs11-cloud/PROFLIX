<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>PROFLIX — Downloads</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .download-page{min-height:100vh;background:radial-gradient(circle at 80% 0,#121b2e 0,transparent 35%),var(--bg)}
    .download-wrap{max-width:1100px;margin:0 auto;padding:35px 24px}
    .download-head{display:flex;align-items:center;justify-content:space-between;gap:15px;margin-bottom:22px}
    .download-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}
    .download-card{background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden}
    .download-card .poster{border:0;border-radius:0}
    .download-card .info{padding:13px}
    .download-card h3{margin:0 0 5px}
    .download-card .meta{margin-bottom:11px}
    .download-actions{display:flex;gap:7px;flex-wrap:wrap}
    .empty{padding:30px;background:var(--panel);border:1px solid var(--line);border-radius:14px;color:var(--muted)}
    @media(max-width:900px){.download-grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
    @media(max-width:650px){.download-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.download-wrap{padding:22px 14px}.download-head{align-items:flex-start}}
  </style>
</head>
<body>
<div class="download-page">
  <header class="topbar standalone">
    <a class="brand mobile-brand" href="index.html">PROFLIX</a>
    <div class="top-actions">
      <a class="btn ghost" href="index.html">Home</a>
      <button class="btn danger" id="logoutBtn">Logout</button>
    </div>
  </header>

  <main class="download-wrap">
    <div class="download-head">
      <div>
        <span class="tag">PROFLIX</span>
        <h1>Downloads</h1>
        <p class="muted">Choose a title and download/open its video file.</p>
      </div>
      <button class="btn ghost" id="refreshDownloads">Refresh</button>
    </div>
    <div id="downloadGrid" class="download-grid">
      <p class="empty">Loading downloads...</p>
    </div>
  </main>
</div>
<script type="module" src="app.js"></script>
</body>
</html>
